name: docker

# Images are published on tags only — merging to main does not push anything.
# Tagging v0.1.0 publishes:
#   ghcr.io/<repo>:0.1.0   and   ghcr.io/<repo>:latest
#
# linux/amd64 only, deliberately. A single job runs on a single architecture,
# so covering arm64 here would mean emulating it under QEMU — 30-60 min for
# this image, well over the 10 minute budget. To add arm64 later: either add a
# second native job on ubuntu-24.04-arm and merge the digests, or accept the
# slower build by adding docker/setup-qemu-action and listing both platforms.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
