name: docker

# Images are published on tags only — merging to main does not push anything.
# Tagging v0.1.0 publishes:
#   ghcr.io/<repo>:0.1.0        full image, mermaid included
#   ghcr.io/<repo>:latest       moved to that same full image
#   ghcr.io/<repo>:0.1.0-slim   no chromium, ~220 MB
#
# Each architecture builds on its own native runner rather than under QEMU,
# then the per-arch digests are merged into one multi-arch manifest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            with_chromium: "1"
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - variant: full
            with_chromium: "1"
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: slim
            with_chromium: "0"
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - variant: slim
            with_chromium: "0"
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only; tags are applied later when the manifest is built.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            WITH_CHROMIUM=${{ matrix.with_chromium }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No GHA layer cache on purpose: releases are tag-only and usually
          # more than 7 days apart, so the cache would be evicted before the
          # next run anyway — it would just write GBs to expire unused.

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The full image is what `latest` points at.
          - variant: full
            suffix: ""
            latest: "true"
          - variant: slim
            suffix: "-slim"
            latest: "false"
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=false so the tag list below is exactly what gets published;
          # onlatest=true keeps the suffix applied to any raw tag.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ matrix.latest == 'true' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE }}:$(jq -cr '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
