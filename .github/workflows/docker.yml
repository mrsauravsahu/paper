name: docker

# Images are published on tags only — merging to main does not push anything.
# Tagging v0.1.0 publishes:
#   ghcr.io/<repo>:0.1.0        full image, mermaid included
#   ghcr.io/<repo>:latest       moved to that same full image
#   ghcr.io/<repo>:0.1.0-slim   no chromium, ~220 MB
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The default variant bundles chromium so every feature works out of
          # the box (~460 MB), and is the one `latest` points at.
          - suffix: ""
            with_chromium: "1"
            latest: "true"
          # -slim drops chromium (~220 MB) for documents with no mermaid.
          - suffix: "-slim"
            with_chromium: "0"
            latest: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false so the tag list below is exactly what gets published;
          # onlatest=true keeps the suffix applied to any raw tag.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ matrix.latest == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WITH_CHROMIUM=${{ matrix.with_chromium }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
